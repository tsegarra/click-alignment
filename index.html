<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click alignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="signed-out">
    <button id="sign-in">Sign in with Google</button>
  </div>

  <div id="loading" hidden>
    <p id="loading-msg">Loading…</p>
  </div>

  <div id="line-area" hidden>
    <div class="line-row">
      <button id="play-song" hidden title="Play the clip with a click on every syllable">▶</button>
      <div id="line" class="line"></div>
    </div>
  </div>

  <div id="task" hidden>
    <div id="prompt"></div>

    <p><button id="play">▶ Play</button></p>

    <div id="bar" class="disabled" aria-disabled="true">
      <div id="zone"></div>
      <div id="playhead" hidden></div>
    </div>

    <div id="handles" class="disabled" aria-disabled="true">
      <div id="start-row" class="handle-row" aria-label="Drag to move the start of the loop">
        <div id="start-handle" class="handle">Start</div>
      </div>
      <div id="end-row" class="handle-row" aria-label="Drag to move the end of the loop">
        <div id="end-handle" class="handle">End</div>
      </div>
    </div>

    <p>
      <button id="back">◂ Back</button>
      <button id="next" class="advance" disabled>Next ▸</button>
      <button id="submit" class="advance" hidden>✓ Submit</button>
    </p>
    <p id="status"></p>
  </div>

  <div id="song-complete" hidden>
    <p>That's all the syllables. To do another song, <a href="#" id="another">click here</a>.</p>
  </div>

  <div id="song-review" hidden>
    <p id="review-msg"></p>
  </div>

  <div id="all-done" hidden>
    <div id="all-lines"></div>
    <p>That's all the songs I've got so far. Thanks for playing!</p>
  </div>

  <p id="account" hidden>
    <span id="who"></span>
    <select id="song-menu" aria-label="Go to a song"></select>
    <button id="sign-out">Sign out</button>
  </p>

  <script type="module" src="app.js"></script>
</body>
</html>
